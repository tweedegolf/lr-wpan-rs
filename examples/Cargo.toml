[package]
edition = "2021"
name = "embassy-stm32u0-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
embassy-stm32 = { version = "0.2.0", features = [ "defmt", "time-driver-any", "stm32g491re", "memory-x", "unstable-pac", "exti", "chrono"]  }
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

lr-wpan-rs = { path = "../lr-wpan-rs" }
lr-wpan-rs-dw1000 = { path = "../lr-wpan-rs-dw1000" }
embedded-hal-bus = { version = "0.3.0", features = ["async", "defmt-03"] }
rand_core = "0.9.3"
rand_core_06 = { package = "rand_core", version = "0.6.4" }
heapless = { version = "0.8.0", features = ["defmt-03"] }

[profile.release]
debug = true
lto = true
opt-level = "z"
